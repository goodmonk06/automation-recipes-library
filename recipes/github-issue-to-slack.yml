id: github-issue-to-slack
name: GitHub Issue通知をSlackに送信
description: GitHub Issueが作成されたときにSlackチャンネルに通知を送信する
version: 1.0.0
triggers:
  - type: webhook
    config:
      endpoint: /webhooks/github
      method: POST
      events:
        - issues.opened
actions:
  - id: notify-slack
    service: slack
    operation: send_message
    params:
      channel: "{{slackChannel}}"
      message: "New GitHub Issue: {{issue.title}} - {{issue.html_url}}"
      username: GitHub Bot
      icon_emoji: ":github:"
paramsSchema:
  slackChannel:
    type: string
    description: 通知先のSlackチャンネル
    required: true
    default: "#dev-notifications"
metadata:
  author: automation-team
  tags:
    - github
    - slack
    - notification
    - webhook
  createdAt: 2025-01-15T00:00:00Z
  updatedAt: 2025-01-15T00:00:00Z
